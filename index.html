<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workforce Ecosystem Design Series: Pre-Read</title>
<meta name="description" content="How the Workforce Ecosystem Design Series reached Session 4 on October 20, 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#161a4f;
  --navy-deep:#0f1238;
  --teal:#0f7f86;
  --teal-light:#8fe0d9;
  --teal-soft:#e4f2f1;
  --paper:#fafbfc;
  --mist:#eef0f6;
  --ink:#1d2040;
  --muted:#5a5f80;
  --line:#dadded;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.65}
a:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}

/* Hero */
.hero{background:var(--navy);color:#fff;padding:72px 0 76px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-130px;top:-130px;width:440px;height:440px;border-radius:50%;border:60px solid var(--teal);opacity:.35}
.hero h1{font-weight:800;font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.08;margin:0 0 16px;max-width:15ch;letter-spacing:-.015em;position:relative}
.hero p{max-width:56ch;margin:0;color:#d5d8f2;font-size:1.12rem;position:relative}

.hero .wrap{position:relative;z-index:1}
.logo{display:block;width:200px;height:auto;margin-bottom:40px;position:relative}
@media (max-width:680px){.logo{width:160px;margin-bottom:28px}}

/* Nav */
nav{position:sticky;top:0;z-index:10;background:rgba(250,251,252,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav ol{list-style:none;display:flex;gap:4px;margin:0 auto;max-width:820px;padding:10px 24px;overflow-x:auto;scrollbar-width:none}
nav a{display:block;white-space:nowrap;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);text-decoration:none}
nav a:hover{color:var(--navy)}
nav a.active{background:var(--navy);color:#fff}

section{scroll-margin-top:64px}
h2{font-weight:800;font-size:clamp(1.6rem,3.6vw,2.1rem);line-height:1.15;color:var(--navy);margin:0 0 18px;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:66ch}

/* Why */
#why{padding:64px 0 56px}
#why .lede{font-size:1.2rem;line-height:1.6}

h3.sub{font-weight:800;font-size:1.2rem;color:var(--navy);margin:32px 0 10px}
.stop p a{color:var(--teal);font-weight:700;text-underline-offset:3px}
.journey{display:block;margin-top:32px;background:var(--navy);color:#fff;text-decoration:none;border-radius:14px;padding:20px 24px;position:relative;max-width:560px}
.journey::after{content:"";position:absolute;right:22px;top:50%;width:12px;height:12px;border-top:3px solid var(--teal-light);border-right:3px solid var(--teal-light);transform:translateY(-50%) rotate(45deg)}
.journey:hover{background:var(--navy-deep)}
.journey:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.journey-title{display:block;font-weight:800;font-size:1.15rem;color:var(--teal-light);padding-right:32px}
.journey-desc{display:block;color:#dfe2f6;font-size:.98rem;margin-top:4px;padding-right:32px}
.cols.last{margin-bottom:0}

/* Find Get Keep */
#fgk{background:var(--teal-soft);padding:64px 0}
.phases{display:grid;grid-template-columns:repeat(3,1fr);margin:28px 0 36px;border-top:3px solid var(--navy)}
.phase{padding:18px 20px 4px 0}
.phase + .phase{padding-left:20px;border-left:1px solid rgba(22,26,79,.2)}
.phase .word{display:block;font-weight:800;font-size:clamp(2.4rem,7vw,3.8rem);line-height:1;color:var(--navy);letter-spacing:-.02em;margin-bottom:14px}
.phase ul{margin:0;padding:0;list-style:none;font-size:.98rem}
.phase li{padding:3px 0}
.barrier-label{font-weight:700;color:var(--navy);margin-bottom:10px}
.barriers{display:flex;flex-wrap:wrap;gap:10px}
.barriers span{background:var(--teal);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:.95rem}

/* Timeline */
#series{padding:72px 0 40px}
.timeline{position:relative;margin-top:36px;padding-left:44px}
.timeline::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:4px;background:linear-gradient(var(--teal),var(--navy));border-radius:4px}
.stop{position:relative;padding-bottom:48px;scroll-margin-top:64px}
.stop::before{content:"";position:absolute;left:-41px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--navy);border:4px solid var(--paper);box-shadow:0 0 0 3px var(--teal)}
.stop.next::before{background:var(--teal);box-shadow:0 0 0 3px var(--navy)}
.stop .date{font-weight:600;color:var(--muted);font-size:.95rem}
.stop h3{font-weight:800;font-size:1.4rem;line-height:1.2;color:var(--ink);margin:4px 0 12px}
.stop.next{padding-bottom:0}
.stop.next .card{background:var(--navy);border-radius:14px;padding:22px 24px}
.stop.next .card a{color:var(--teal-light);font-weight:700;text-underline-offset:3px}
.stop.next .card p{color:#dfe2f6;margin:0}

/* Priorities + pilots */
#led{background:var(--mist);padding:72px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:8px 0 40px}
.col{background:#fff;border-radius:14px;padding:22px 24px;border-top:5px solid var(--teal)}
.col.sys{border-top-color:var(--navy)}
.col h3{font-weight:800;font-size:1.1rem;color:var(--navy);margin:0 0 10px}
.col ul{margin:0;padding-left:1.1em}
.col li{padding:4px 0}

footer{background:var(--navy-deep);color:#b9bde0;padding:36px 0;text-align:center;font-weight:500}
footer strong{color:#fff;font-weight:700}

@media (max-width:680px){
  body{font-size:1.125rem;line-height:1.6}
  .wrap{padding:0 18px}
  .hero{padding:44px 0 40px}
  .hero::after{width:240px;height:240px;right:-110px;top:-110px;border-width:36px;opacity:.25}
  .hero h1{font-size:2.1rem}
  .hero p{font-size:1.05rem}
  nav ol{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px;overflow:visible}
  nav a{text-align:center;padding:7px 4px;font-size:.9rem;background:var(--mist)}
  nav a.active{background:var(--navy)}
  section,.stop{scroll-margin-top:110px}
  #why,#fgk,#led{padding:44px 0}
  #series{padding:48px 0 24px}
  h2{font-size:1.55rem}
  #why .lede{font-size:1.15rem}
  .phase .word{font-size:2.6rem;margin-bottom:8px}
  .phase ul{font-size:1.05rem}
  .barriers span{font-size:1rem}
  .stop{padding-bottom:36px}
  .stop h3{font-size:1.3rem}
  .col,.stop.next .card{padding:20px}
  .col li{font-size:1.05rem}
  .phases,.cols{grid-template-columns:1fr}
  .phase + .phase{padding-left:0;border-left:0;border-top:1px solid rgba(22,26,79,.2)}
  .phase{padding-bottom:18px}
  .timeline{padding-left:32px}
  .timeline::before{left:7px}
  .stop::before{left:-31px;width:16px;height:16px}
}
</style>
</head>
